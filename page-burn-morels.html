        <h1>Burn Morels</h1>
<p>Burn morels are a species of mushroom that can only grow on charred Dirt at any light level. Burn morels once harvested will turn charred Dirt and Coarse Dirt back into normal Dirt. Can be eaten but cause enflamed effect.</p>
