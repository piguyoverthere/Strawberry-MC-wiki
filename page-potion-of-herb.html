        <h1>Potion Of Herb</h1>
<p>Potions of Herb are the precursor to Potions of Luck, only needing a Rabbit Foot item to be [see also: <a href="page-clovers.html">Clovers</a>] brewed into this potion. Potions of Herb are brewed by brewing a 4-leaf Clover into a Thick Potion.</p>
