        <h1>Noteblocks</h1>
<h2 id="honey">Honey</h2>
<p>When a bottle of honey is used on a noteblock, the noteblock will become a honey noteblock. Honey noteblocks play a longer sound than normal compared to a not sticky noteblock when activated.</p>
