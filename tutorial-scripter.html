        <h1>Scripter</h1>
        <p>The Scripter is a new block that acts as a physical compiler to execute ComScript. The Scripter block cannot be obtained from the default inventory (assuming the debug tab is turned off). Instead, use /give @p strawberrymc:scripter to obtain the Scripter.</p>
